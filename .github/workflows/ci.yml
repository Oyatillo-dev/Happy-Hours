name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-and-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hh
          POSTGRES_PASSWORD: hh
          POSTGRES_DB: happyhours_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hh"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hh:hh@localhost:5432/happyhours_test
      TEST_DATABASE_URL: postgresql://hh:hh@localhost:5432/happyhours_test
      JWT_SECRET: ci-secret-access
      PAYMENT_WEBHOOK_SECRET: ci-secret-webhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
