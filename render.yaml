# Render Blueprint: Render → New → Blueprint → this repository.
# Creates the PostgreSQL database and the API (from apps/api/Dockerfile). Photos are stored in
# Cloudflare R2. The cabinet (apps/web) is deployed separately on Vercel.
databases:
  - name: happy-hours-db
    plan: basic-256mb
    region: frankfurt
    databaseName: happyhours
    user: hh

services:
  - type: web
    name: happy-hours-api
    runtime: docker
    # Always-on: the API runs a job every minute (expiring reservations, no-shows,
    # refund retries), which a free instance that sleeps when idle would skip.
    plan: starter
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Redeploy only when the API changes.
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - package-lock.json
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: happy-hours-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_PHONES
        value: "+996700000001"
      # The cabinet on Vercel; add your own domain here later, comma separated.
      - key: CORS_ORIGINS
        value: https://sakta-kg.vercel.app,https://happy-hours-seven.vercel.app
      # Two proxies sit in front of the API on Render: Cloudflare and Render's load balancer
      # (checked: with 1, /health reported a Cloudflare address instead of the caller's).
      - key: TRUST_PROXY
        value: "2"
      - key: PUSH_PROVIDER
        value: expo
      # TEST SERVER until a bank and Nikita.kg are connected: payments without money and
      # login codes shown on screen. Remove both before real customers use the service.
      - key: ALLOW_MOCK_PAYMENTS
        value: "true"
      - key: SHOW_OTP_CODES
        value: "true"
      # Uploaded photos in Cloudflare R2 (bucket with a public r2.dev URL). The two keys are
      # secrets: enter them in the Render dashboard (Environment), never in this file.
      - key: R2_ACCOUNT_ID
        value: 4c4f8bc969523e39da59561b9415cceb
      - key: R2_BUCKET
        value: happy-hours-uploads
      - key: R2_PUBLIC_URL
        value: https://pub-c9d135589bad4bc9b1256bf9a072594f.r2.dev
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
